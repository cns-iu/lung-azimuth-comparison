<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CTs Supertree</title>
<link rel="stylesheet" href="assets/app.css?v=76125ae9bf" />
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.33.1/dist/cytoscape.min.js"></script>
</head>
<body>

<aside id="sidebar">
  <div id="brandBar"><span id="siteTitle">CTs Supertree</span></div>

  <div id="viewHeader">
    <h1 id="viewTitle"></h1>
    <p id="viewDescription"></p>
  </div>

  <div id="searchWrap">
    <input id="searchInput" type="search"
           placeholder="Search cell type, ID, source" autocomplete="off"
           aria-label="Search the graph" />
    <button id="searchButton" title="Search" aria-label="Search">⌕</button>
    <p class="search-hint">Press <kbd>Esc</kbd> to clear</p>
  </div>

  <!-- Per-view controls (e.g. scope filters); empty for views without any. -->
  <div id="viewFilters"></div>

  <!-- Details first: it responds to clicks, so it sits at the scroller's
       default position. The static summary cards follow underneath. -->
  <div id="panelScroller">
    <div id="detailsPanel" class="empty-state">Select a node to inspect its details.</div>
    <div id="summaryPanel"></div>
  </div>
</aside>

<main id="main">
  <nav id="tabBar" role="tablist">
    <button class="tab" role="tab" data-view="overview">Overview</button>
    <button class="tab" role="tab" data-view="reference-lung">Reference Supertree</button>
    <button class="tab" role="tab" data-view="population">HRApop Comparison</button>
    <button class="tab" role="tab" data-view="hlca">HLCA Node Comparison</button>
    <button class="tab" role="tab" data-view="agreement">Tool Agreement</button>
  </nav>
  <div id="paneStack">
    <section class="graph-pane" id="pane-overview"
             role="tabpanel" aria-label="Overview">
      <div class="cy-host" id="cy-overview"></div>
      <canvas class="node-overlay"></canvas>
      <div class="status-badge"></div>
      <div class="minimap" title="Drag the box to pan · drag elsewhere to zoom to that region · click to center · double-click to fit">
        <canvas role="img" aria-label="Overview of the whole graph with the current viewport marked"></canvas>
        <button type="button" class="minimap-reset" title="Reset" aria-label="Reset the view to fit the whole graph">
          <img src="assets/icons/reset.png?v=76125ae9bf" alt="" width="14" height="14" />
        </button>
      </div>
      <div class="legend"></div>
      <div class="view-status">Loading view…</div>
    </section>
    <section class="graph-pane" id="pane-reference-lung"
             role="tabpanel" aria-label="Reference Supertree">
      <div class="cy-host" id="cy-reference-lung"></div>
      <canvas class="node-overlay"></canvas>
      <div class="status-badge"></div>
      <div class="minimap" title="Drag the box to pan · drag elsewhere to zoom to that region · click to center · double-click to fit">
        <canvas role="img" aria-label="Overview of the whole graph with the current viewport marked"></canvas>
        <button type="button" class="minimap-reset" title="Reset" aria-label="Reset the view to fit the whole graph">
          <img src="assets/icons/reset.png?v=76125ae9bf" alt="" width="14" height="14" />
        </button>
      </div>
      <div class="legend"></div>
      <div class="view-status">Loading view…</div>
    </section>
    <section class="graph-pane" id="pane-population"
             role="tabpanel" aria-label="HRApop Comparison">
      <div class="cy-host" id="cy-population"></div>
      <canvas class="node-overlay"></canvas>
      <div class="status-badge"></div>
      <div class="minimap" title="Drag the box to pan · drag elsewhere to zoom to that region · click to center · double-click to fit">
        <canvas role="img" aria-label="Overview of the whole graph with the current viewport marked"></canvas>
        <button type="button" class="minimap-reset" title="Reset" aria-label="Reset the view to fit the whole graph">
          <img src="assets/icons/reset.png?v=76125ae9bf" alt="" width="14" height="14" />
        </button>
      </div>
      <div class="legend"></div>
      <div class="view-status">Loading view…</div>
    </section>
    <section class="graph-pane" id="pane-hlca"
             role="tabpanel" aria-label="HLCA Node Comparison">
      <div class="cy-host" id="cy-hlca"></div>
      <canvas class="node-overlay"></canvas>
      <div class="status-badge"></div>
      <div class="minimap" title="Drag the box to pan · drag elsewhere to zoom to that region · click to center · double-click to fit">
        <canvas role="img" aria-label="Overview of the whole graph with the current viewport marked"></canvas>
        <button type="button" class="minimap-reset" title="Reset" aria-label="Reset the view to fit the whole graph">
          <img src="assets/icons/reset.png?v=76125ae9bf" alt="" width="14" height="14" />
        </button>
      </div>
      <div class="legend"></div>
      <div class="view-status">Loading view…</div>
    </section>
    <section class="graph-pane" id="pane-agreement"
             role="tabpanel" aria-label="Tool Agreement">
      <div class="cy-host" id="cy-agreement"></div>
      <canvas class="node-overlay"></canvas>
      <div class="status-badge"></div>
      <div class="minimap" title="Drag the box to pan · drag elsewhere to zoom to that region · click to center · double-click to fit">
        <canvas role="img" aria-label="Overview of the whole graph with the current viewport marked"></canvas>
        <button type="button" class="minimap-reset" title="Reset" aria-label="Reset the view to fit the whole graph">
          <img src="assets/icons/reset.png?v=76125ae9bf" alt="" width="14" height="14" />
        </button>
      </div>
      <div class="legend"></div>
      <div class="view-status">Loading view…</div>
    </section>
  </div>
</main>

<div id="tooltip"></div>

ol Agreement","subtitle":"Where five CTann tools agree or disagree in lung single-cell transcriptomics data","tabTitle":"Tool Agreement","dataUrl":"data/agreement.json","design":{"legend":{"show":true,"position":"bottom"},"interactions":{"highlightSubtree":true,"highlightParentPath":true,"zoomOnPan":true,"search":true,"fit":true,"exportPng":true},"colors":{"neutral":"#b9bec7","search":"#7C3AED","disagree":"#a6611a","mixed":"#e4d9c2","agree":"#018571"}},"params":{}}]};</script>

</body>
